# Application Configuration
spring.application.name=hotel-billing-system
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel_billing
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# Logging
logging.level.com.hotel.billing=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# File Upload (for menu images if needed later)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (will be configured in SecurityConfig)
# Allowing all origins for development

# Application URLs
app.frontend.url=http://localhost:5173
app.backend.url=http://localhost:8080
app.invoice.base-url=http://localhost:5173/invoice

# Tax Configuration (can be overridden via admin later)
app.tax.default-percentage=5.0
